name: References
on: [push, pull_request]
permissions:
  contents: read
jobs:
  immutable-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-linux-boundary.py
      - run: python3 -m pip install -r tools/visual-requirements.txt
      - run: python3 scripts/verify-references.py
      - run: python3 scripts/discover-reference.py --check
      - run: python3 scripts/verify-proposals.py
      - run: python3 scripts/verify-presentation-state-source.py
      - run: python3 scripts/verify-native-loading.py
      - run: python3 scripts/verify-spinner-source.py
      - run: python3 scripts/verify-alert-source.py
      - run: python3 scripts/verify-navigation-layout-source.py
      - run: python3 scripts/verify-sidebar-brand-source.py
      - run: python3 scripts/verify-data-metrics-source.py
      - run: python3 scripts/verify-native-source-rebuild.py
      - run: python3 scripts/verify-number-locales-source.py
      - run: python3 scripts/verify-stepper-source.py
      - run: python3 scripts/verify-radio-source.py
      - run: python3 scripts/verify-otp-source.py
      - run: python3 scripts/verify-activity-source.py
      - run: python3 scripts/verify-activity-text-source.py
      - run: python3 scripts/verify-activity-layout-source.py
      - run: python3 scripts/verify-activity-alignment-source.py
      - run: python3 scripts/verify-modal-source.py
      - run: python3 scripts/verify-modal-input-source.py
      - run: python3 scripts/verify-tooltip-source.py
      - run: python3 scripts/verify-button-style-source.py
      - run: python3 scripts/verify-button-style-colors.py
      - run: python3 scripts/verify-button-style-candidate.py
      - run: python3 scripts/verify-font-modifier-source.py
      - run: python3 scripts/verify-font-baseline-source.py
      - run: python3 scripts/verify-font-edges-source.py
      - run: python3 scripts/verify-surface-modifier-source.py
      - run: python3 scripts/verify-surface-baseline-input-source.py
      - run: python3 scripts/generate-font-modifier-witnesses.py --check
      - run: python3 scripts/generate-surface-modifier-witnesses.py --check
      - run: python3 scripts/generate-surface-supplement-witnesses.py --check
      - run: python3 scripts/verify-surface-modifier-candidate.py
      - run: python3 scripts/verify-surface-supplement-candidate.py
      - run: python3 scripts/verify-surface-stroke-dense.py
      - run: python3 scripts/verify-pill-modifier-source.py
      - run: python3 scripts/verify-charts-source.py
      - run: python3 scripts/verify-pill-modifier-candidate.py
      - run: python3 scripts/verify-pill-marker-raster.py evidence/development/pill-modifier-20261017/native-marker-raster.json --check
      - run: python3 scripts/generate-pill-witnesses.py --check
      - run: python3 scripts/generate-chart-witnesses.py --check
      - run: python3 scripts/verify-chart-candidate.py
      - run: python3 scripts/verify-chart-geometry-source.py
      - run: python3 scripts/verify-chart-geometry-candidate.py
      - run: python3 scripts/verify-font-modifier-candidate.py
      - run: python3 scripts/generate-otp-unicode.py --check
      - run: python3 scripts/generate-otp-witnesses.py --check
      - run: python3 scripts/generate-activity-witnesses.py --check
      - run: python3 scripts/generate-modal-witnesses.py --check
      - run: python3 scripts/generate-button-style-witnesses.py --check
      - run: python3 scripts/generate-radio-witnesses.py --check
      - run: python3 scripts/generate-stepper-witnesses.py --check
      - run: python3 scripts/generate-number-format-witnesses.py --check
      - run: python3 scripts/verify-data-metrics-inputs.py
      - run: python3 -m unittest discover -s tests/contracts -v
