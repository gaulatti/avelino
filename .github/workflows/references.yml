name: References
on: [push, pull_request]
permissions:
  contents: read
jobs:
  immutable-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-linux-boundary.py
      - run: python3 -m pip install -r tools/visual-requirements.txt
      - run: python3 scripts/verify-references.py
      - run: python3 scripts/discover-reference.py --check
      - run: python3 scripts/verify-proposals.py
      - run: python3 scripts/verify-presentation-state-source.py
      - run: python3 scripts/verify-native-loading.py
      - run: python3 scripts/verify-spinner-source.py
      - run: python3 scripts/verify-alert-source.py
      - run: python3 -m unittest discover -s tests/contracts -v
