name: Reference captures
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop-swiftui:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/capture-reference.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-reference-candidates
          path: artifacts/reference
