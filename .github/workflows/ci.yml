name: Avelino CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Verify PR #{0}', github.event.pull_request.number) ||
      inputs.check_author && 'Verify repair author' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'Verify main' ||
      format('PR review ({0})', github.event.pull_request.number || github.event.issue.number || inputs.pull_request || github.ref_name) }}
on:
  push:
    branches: [main, 'policy-install/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to reassess without executing contributor code; empty runs verification
        type: string
        required: false
      check_author:
        description: Inspect existing repair author identity and repository access without writing or deploying
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: avelino-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request || github.ref }}
  cancel-in-progress: true
jobs:
  resolve-clouseau:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.engine.outputs.sha }}
      digest: ${{ steps.engine.outputs.digest }}
    steps:
      - id: engine
        uses: gaulatti/clouseau/scripts/resolve@fd655851419980f833ff13a94b0d6ff41a901cb2

  unit:
    if: &verify-code >-
      github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_author)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      workflow_tests_passed: ${{ steps.workflow-tests.outputs.workflow_tests_passed }}
    needs: resolve-clouseau
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out this run frozen Clouseau engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - name: Fetch full history for reference verification
        run: git fetch --unshallow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Generated tokens are current
        run: node scripts/generate-tokens.mjs --check
      - name: Install visual verification requirements
        run: python3 -m pip install -r tools/visual-requirements.txt
      - name: Verify references, sources, witnesses and contracts
        run: |
          python3 scripts/check-linux-boundary.py
          python3 scripts/verify-references.py
          python3 scripts/discover-reference.py --check
          python3 scripts/verify-proposals.py
          python3 scripts/verify-presentation-state-source.py
          python3 scripts/verify-native-loading.py
          python3 scripts/verify-spinner-source.py
          python3 scripts/verify-alert-source.py
          python3 scripts/verify-navigation-layout-source.py
          python3 scripts/verify-sidebar-brand-source.py
          python3 scripts/verify-footer-source.py
          python3 scripts/verify-button-group-source.py
          python3 scripts/verify-button-group-candidate.py
          python3 scripts/verify-font-raster-investigation.py
          python3 scripts/verify-mobile-shell-source.py
          python3 scripts/verify-admin-shell-source.py
          python3 scripts/verify-admin-shell-context.py
          python3 scripts/verify-admin-shell-pinned-matrix.py
          python3 scripts/verify-admin-shell-colour-inputs.py
          python3 scripts/generate-admin-shell-colours.py --check
          python3 scripts/verify-admin-source-colour-fixture.py
          python3 scripts/verify-admin-source-colour-package.py
          python3 scripts/verify-admin-source-colour-sessions.py
          python3 scripts/verify-admin-clipping.py
          python3 scripts/verify-admin-clipping-package.py
          python3 scripts/verify-admin-shell-materials.py
          python3 scripts/verify-admin-divider.py
          python3 scripts/verify-admin-divider-package.py
          python3 scripts/verify-admin-sidebar-background.py
          python3 scripts/generate-admin-shell-witnesses.py --check
          python3 scripts/verify-admin-shell-candidate.py
          python3 scripts/verify-admin-shell-package.py
          python3 scripts/verify-admin-shell-sessions.py --failed-attempt
          python3 scripts/verify-admin-shell-sessions.py
          python3 scripts/generate-mobile-shell-witnesses.py --check
          python3 scripts/verify-mobile-shell-candidate.py
          python3 scripts/verify-footer-candidate.py
          python3 scripts/verify-data-metrics-source.py
          python3 scripts/verify-native-source-rebuild.py
          python3 scripts/verify-number-locales-source.py
          python3 scripts/verify-stepper-source.py
          python3 scripts/verify-stepper-reader.py
          python3 scripts/verify-stepper-native-names.py
          python3 scripts/verify-radio-source.py
          python3 scripts/verify-otp-source.py
          python3 scripts/verify-activity-source.py
          python3 scripts/verify-activity-text-source.py
          python3 scripts/verify-activity-layout-source.py
          python3 scripts/verify-activity-alignment-source.py
          python3 scripts/verify-modal-source.py
          python3 scripts/verify-modal-input-source.py
          python3 scripts/verify-modal-parent-focus.py
          python3 scripts/verify-tooltip-source.py
          python3 scripts/verify-button-style-source.py
          python3 scripts/verify-button-style-colors.py
          python3 scripts/verify-button-style-candidate.py
          python3 scripts/verify-font-modifier-source.py
          python3 scripts/verify-font-baseline-source.py
          python3 scripts/verify-font-edges-source.py
          python3 scripts/verify-surface-modifier-source.py
          python3 scripts/verify-surface-baseline-input-source.py
          python3 scripts/generate-font-modifier-witnesses.py --check
          python3 scripts/generate-surface-modifier-witnesses.py --check
          python3 scripts/generate-surface-supplement-witnesses.py --check
          python3 scripts/verify-surface-modifier-candidate.py
          python3 scripts/verify-surface-supplement-candidate.py
          python3 scripts/verify-surface-stroke-dense.py
          python3 scripts/verify-pill-modifier-source.py
          python3 scripts/verify-charts-source.py
          python3 scripts/verify-media-library-source.py
          python3 scripts/verify-hero-carousel-source.py
          python3 scripts/verify-hero-carousel-history.py
          python3 scripts/verify-date-range-source.py
          python3 scripts/verify-date-range-input.py
          python3 scripts/verify-date-range-interpretation.py
          python3 scripts/generate-date-range-witnesses.py --check
          python3 scripts/verify-date-range-owned-editors.py
          python3 scripts/verify-date-range-retained-history.py
          python3 scripts/verify-date-range-font-source.py
          python3 scripts/generate-date-editor-patterns.py --check
          python3 scripts/verify-date-range-editor-presentation.py
          python3 scripts/check-date-range-catalog-publication.py
          python3 scripts/verify-date-range-width-investigation.py
          python3 scripts/verify-date-range-chrome-correction.py
          python3 scripts/verify-date-range-reservation.py
          python3 scripts/verify-date-range-reservation-checkpoint.py
          python3 scripts/verify-date-chinese-source.py
          python3 scripts/generate-date-chinese-witnesses.py --check
          python3 scripts/verify-date-chinese-checkpoint.py
          python3 scripts/verify-date-range-fields-checkpoint.py
          python3 scripts/verify-date-range-assistive-lifetime.py
          python3 scripts/verify-navigation-cjk-metrics.py
          python3 scripts/verify-weston-popup-checkpoint.py
          python3 scripts/verify-weston-display-checkpoint.py
          python3 scripts/generate-date-literal-input-witnesses.py --check
          python3 scripts/verify-date-literal-input-checkpoint.py
          python3 scripts/verify-qt-software-opacity-controls.py
          python3 scripts/verify-qt-software-source-patch.py
          python3 scripts/verify-qt-software-rectangle-candidate.py
          python3 scripts/verify-qt-software-rectangle-toolchain.py
          python3 scripts/verify-qt-rectangle-linux-driver.py
          python3 scripts/verify-qt-rectangle-build-context.py
          python3 scripts/verify-qt-software-toolchain.py
          python3 scripts/verify-ci-artifact-ownership.py
          python3 scripts/generate-hero-carousel-witnesses.py --check
          python3 scripts/verify-hero-carousel-candidate.py
          python3 scripts/verify-ci-runtime-contracts.py
          python3 scripts/verify-item-lifetime.py
          python3 scripts/verify-app-tabs-source.py
          python3 scripts/verify-app-tabs-candidate.py
          python3 scripts/verify-app-tabs-raster.py
          python3 scripts/verify-command-spotlight-source.py
          python3 scripts/verify-dropdown-menu-source.py
          python3 scripts/verify-file-input-source.py
          python3 scripts/verify-file-input-types.py
          python3 scripts/verify-file-input-controls.py
          python3 scripts/verify-file-input-search.py
          python3 scripts/verify-file-input-search-accessibility.py
          python3 scripts/verify-file-input-search-menu.py
          python3 scripts/verify-file-input-search-history.py
          python3 scripts/verify-file-input-search-token-editing.py
          python3 scripts/verify-file-input-search-token-baseline.py
          python3 scripts/verify-file-input-search-atomic.py
          python3 scripts/verify-file-input-search-atomic-integration.py
          python3 scripts/verify-file-input-search-presentation.py
          python3 scripts/verify-file-input-search-pointer.py
          python3 scripts/verify-file-input-search-boundary-history.py
          python3 scripts/verify-file-input-views.py
          python3 scripts/verify-file-input-location.py
          python3 scripts/verify-file-input-location-policy.py
          python3 scripts/verify-file-input-go-to.py
          python3 scripts/verify-file-input-go-to-history.py
          python3 scripts/verify-file-input-go-to-close.py
          python3 scripts/verify-file-input-go-to-linux.py
          python3 scripts/verify-file-input-go-to-editing.py
          python3 scripts/verify-file-input-go-to-suggestions.py
          python3 scripts/generate-file-input-witnesses.py --check
          python3 scripts/verify-file-input-linux.py
          python3 scripts/verify-file-input-announcements.py
          python3 scripts/verify-file-input-navigation.py
          python3 scripts/verify-file-input-views-linux.py
          python3 scripts/verify-file-input-location-linux.py
          python3 scripts/verify-dropdown-menu-supplement.py
          python3 scripts/generate-dropdown-menu-witnesses.py --check
          python3 scripts/verify-dropdown-menu-candidate.py
          python3 scripts/generate-command-spotlight-witnesses.py --check
          python3 scripts/verify-command-spotlight-candidate.py
          python3 scripts/generate-app-tabs-witnesses.py --check
          python3 scripts/generate-media-library-witnesses.py --check
          python3 scripts/verify-pill-modifier-candidate.py
          python3 scripts/verify-pill-marker-raster.py evidence/development/pill-modifier-20261017/native-marker-raster.json --check
          python3 scripts/generate-pill-witnesses.py --check
          python3 scripts/generate-chart-witnesses.py --check
          python3 scripts/verify-chart-candidate.py
          python3 scripts/verify-chart-geometry-source.py
          python3 scripts/verify-chart-geometry-candidate.py
          python3 scripts/verify-media-library-candidate.py
          python3 scripts/verify-media-library-reflow.py
          python3 scripts/verify-media-library-caption.py
          python3 scripts/verify-font-modifier-candidate.py
          python3 scripts/generate-otp-unicode.py --check
          python3 scripts/generate-otp-witnesses.py --check
          python3 scripts/generate-activity-witnesses.py --check
          python3 scripts/generate-modal-witnesses.py --check
          python3 scripts/generate-button-style-witnesses.py --check
          python3 scripts/generate-radio-witnesses.py --check
          python3 scripts/generate-stepper-witnesses.py --check
          python3 scripts/generate-number-format-witnesses.py --check
          python3 scripts/verify-data-metrics-inputs.py
          python3 -m unittest discover -s tests/contracts -v
      - name: Set up Python for frozen shared tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen shared test dependencies
        run: python3 -m pip install --disable-pip-version-check -r .clouseau-ci/requirements-test.txt
      - name: Test approval policy
        uses: ./.clouseau-ci
        with:
          operation: test
      - name: Test workflow routing
        id: workflow-tests
        run: |
          test -f .github/tests/routing.test.mjs
          npm ci --prefix .github/tests --ignore-scripts --no-audit --no-fund
          npm test --prefix .github/tests
          echo 'workflow_tests_passed=true' >> "$GITHUB_OUTPUT"

  verify:
    name: >-
      ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_author)) && 'verify' || 'metadata-only' }}
    needs: [unit, build, resolve-clouseau]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - name: Require passing unit and build checks
        if: >-
          always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request == '' && !inputs.check_author))
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$UNIT_RESULT" = success && test "$BUILD_RESULT" = success
      - name: Enforce 100% line and branch coverage
        if: *verify-code
        run: >-
          echo "::warning::Exact coverage is not enforced: the repository produces no native coverage report in a format the shared gate supports. The policy selects manual merge mode, so the owner merges."
      - name: Require workflow tests execution
        if: *verify-code
        env:
          WORKFLOW_TESTS_PASSED: ${{ needs.unit.outputs.workflow_tests_passed }}
        run: test "$WORKFLOW_TESTS_PASSED" = true

  build:
    if: *verify-code
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/Dockerfile
          tags: avelino-toolchain:qt6.8.3
          load: true
          cache-from: type=gha,scope=toolchain-ci
          cache-to: type=gha,mode=max,scope=toolchain-ci
      - name: Seed obsolete package files for regeneration check
        run: |
          mkdir -p artifacts/package/consumer artifacts/package/install
          printf '%s\n' 'obsolete consumer fixture' > artifacts/package/consumer/main.cpp
          touch artifacts/package/install/obsolete-fixture
      - name: Build and check the Linux runtime package in the toolchain image
        run: docker run --rm -v "$PWD:/work" avelino-toolchain:qt6.8.3 bash scripts/check-linux.sh
      - name: Verify package replaced stale sources and install files
        run: |
          cmp tests/consumer/main.cpp artifacts/package/consumer/main.cpp
          cmp tests/consumer/Main.qml artifacts/package/consumer/Main.qml
          test ! -e artifacts/package/install/obsolete-fixture
          test ! -d artifacts/package/consumer/consumer

  assess-intent:
    if: &review-event >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/heads/policy-install/'))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    outputs:
      assessment: ${{ steps.local-review.outputs.assessment || steps.assess.outputs.assessment }}
      number: ${{ steps.install.outputs.number || github.event.pull_request.number }}
    needs: resolve-clouseau
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - name: Verify the owner-authorized frozen reviewer installation
        if: github.event_name == 'push'
        id: install
        uses: actions/github-script@v7
        with:
          script: |
            const match = context.ref.match(/^refs\/heads\/policy-install\/pr-([1-9][0-9]*)$/);
            if (context.actor !== context.repo.owner || !/^[a-f0-9]{40}$/.test(context.sha) || !match) {
              throw new Error('Reviewer installation requires the repository owner and a ready PR number');
            }
            const pull_number = Number(match[1]);
            if (!Number.isSafeInteger(pull_number)) throw new Error('Invalid installation PR number');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number});
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.user.login !== context.repo.owner || pr.head.sha !== context.sha ||
                pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Installation requires the owner-authored same-repository PR at this exact workflow revision');
            }
            const comments = await github.paginate(github.rest.issues.listComments,
              {...context.repo, issue_number: pull_number, per_page: 100});
            if (!comments.some(comment => comment.user?.type === 'User' && comment.user.login === context.repo.owner &&
                comment.body.trim() === `/approve-intent ${context.sha}`)) {
              throw new Error('Installation requires owner intent confirmation at this exact revision');
            }
            core.setOutput('number', String(pull_number));
      # Never load the controller or its configuration from the PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out this run frozen Clouseau engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - name: Wait for tests, exact coverage, and build
        uses: actions/github-script@v7
        env:
          REQUESTED_PR: ${{ steps.install.outputs.number }}
        with:
          script: |
            const path = require('node:path');
            const root = path.resolve('.clouseau-ci');
            const config = require(path.join(root, 'src/config.cjs')).loadConfig('.github/clouseau.json');
            const policy = require(path.join(root, 'src/policy.cjs')).createPolicy(config, {engine: require(path.join(root, 'src/central-version.cjs')).environmentEngine()});
            const number = context.payload.pull_request?.number || Number(process.env.REQUESTED_PR);
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
              const expected = context.payload.pull_request?.head.sha || context.sha;
              if (pr.state !== 'open' || pr.draft || pr.head.sha !== expected) {
                throw new Error('PR closed, became draft, or changed while verification was pending');
              }
              const result = await policy.technicalRun(github, context.repo, pr);
              if (result.failure) throw new Error(result.failure);
              if (!result.pending) { core.info(`Verified PR CI: ${result.url}. Clouseau acceptance can now start.`); return; }
              core.info('Waiting for independent unit, coverage and build checks. No AI request has been made.');
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('PR verification did not complete within 30 minutes');
      - name: Select authenticated local review or the installed CI reviewer
        id: review-route
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('local', String((context.payload.pull_request?.body || '').includes('clouseau-local-review:v1')));
      - name: Verify authenticated local review without AI credentials
        if: steps.review-route.outputs.local == 'true'
        id: local-review
        uses: ./.clouseau-ci
        with:
          operation: verify-local
          pull-request: ${{ steps.install.outputs.number }}
          wait-for-verification: 'false'
      - name: Review unstamped PR through the installed CI AI reviewer
        if: steps.review-route.outputs.local != 'true'
        uses: ./.clouseau-ci
        id: assess
        with:
          operation: assess
          pull-request: ${{ steps.install.outputs.number }}
          wait-for-verification: 'false'
          provider-key: ${{ secrets.DEEPSEEK_API_KEY }}
          typesafe-key: ${{ secrets.TYPESAFE_API_KEY }}
      - name: Retain acceptance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clouseau-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/clouseau-acceptance*.json
          if-no-files-found: ignore

  approve-and-merge:
    name: ${{ ((github.event_name == 'pull_request_target' && !github.event.pull_request.draft) || (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/heads/policy-install/'))) && 'approve-and-merge' || 'metadata-only-approval' }}
    needs: [assess-intent, resolve-clouseau]
    # Always resolve the job name; only trusted, ready PR events run its steps.
    # A failed assessment must still fail the required native approval check.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: pr-approval-${{ needs.assess-intent.outputs.number || github.run_id }}
      cancel-in-progress: false
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - name: Require a completed assessment
        if: >-
          ((github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
          (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/heads/policy-install/'))) &&
          needs.assess-intent.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        if: *review-event
        with:
          ref: main
          persist-credentials: false
      - name: Check out this run frozen Clouseau engine
        if: *review-event
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - name: Load this run's acceptance record
        if: >-
          ((github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
          (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/heads/policy-install/'))) &&
          needs.assess-intent.result == 'success' &&
          fromJSON(needs.assess-intent.outputs.assessment).record_digest != ''
        uses: actions/download-artifact@v4
        with:
          name: clouseau-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: work
      - if: *review-event
        uses: ./.clouseau-ci
        with:
          operation: gate
          pull-request: ${{ needs.assess-intent.outputs.number }}
          native-gate: 'true'
          assessment: ${{ needs.assess-intent.outputs.assessment }}

  apply-repair:
    needs: [assess-intent, approve-and-merge, resolve-clouseau]
    if: >-
      always() && github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.assess-intent.result == 'success' && needs.approve-and-merge.result == 'failure' &&
      fromJSON(needs.assess-intent.outputs.assessment).repair_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    concurrency:
      group: pr-approval-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out this run frozen Clouseau engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: clouseau-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: work
      - uses: ./.clouseau-ci
        with:
          operation: repair
          assessment: ${{ needs.assess-intent.outputs.assessment }}
          repair-token: ${{ secrets.DEPLOYMENT_TOKEN }}

  finalize-merge:
    needs: [assess-intent, approve-and-merge, resolve-clouseau]
    if: *review-event
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out this run frozen Clouseau engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - uses: ./.clouseau-ci
        with:
          operation: finalize
          pull-request: ${{ needs.assess-intent.outputs.number }}
          assessment: ${{ needs.assess-intent.outputs.assessment }}

  request-reassessment:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve-intent ')) ||
      (github.event_name == 'workflow_dispatch' && inputs.pull_request != '' && !inputs.check_author)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    needs: resolve-clouseau
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out this run frozen Clouseau engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - uses: ./.clouseau-ci
        with:
          operation: request-reassessment
          pull-request: ${{ inputs.pull_request }}

  check-author:
    if: github.event_name == 'workflow_dispatch' && inputs.check_author
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Verify independent repair author without writing
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPLOYMENT_TOKEN }}
          script: |
            const {data: user} = await github.rest.users.getAuthenticated();
            const {data: repository} = await github.rest.repos.get(context.repo);
            if (user.login === 'github-actions[bot]' || !repository.permissions?.push) {
              throw new Error('Repair requires an independent author with Contents write access');
            }
            core.info(`Independent repair author ${user.login} can access ${context.repo.owner}/${context.repo.repo}. No write or deployment was made.`);
