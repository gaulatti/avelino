name: Linux
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-runtime-package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: node scripts/generate-tokens.mjs --check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/Dockerfile
          tags: avelino-toolchain:qt6.8.3
          load: true
          cache-from: type=gha,scope=toolchain-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ matrix.runner }}
      - name: Seed obsolete package files for regeneration check
        run: |
          mkdir -p artifacts/package/consumer artifacts/package/install
          printf '%s\n' 'obsolete consumer fixture' > artifacts/package/consumer/main.cpp
          touch artifacts/package/install/obsolete-fixture
      - run: docker run --rm -v "$PWD:/work" avelino-toolchain:qt6.8.3 bash scripts/check-linux.sh
      - name: Verify package replaced stale sources and install files
        run: |
          cmp tests/consumer/main.cpp artifacts/package/consumer/main.cpp
          cmp tests/consumer/Main.qml artifacts/package/consumer/Main.qml
          test ! -e artifacts/package/install/obsolete-fixture
          test ! -d artifacts/package/consumer/consumer
      - name: Consumer with source and build trees absent
        run: docker run --rm -v "$PWD/artifacts/package:/package" -w /package avelino-toolchain:qt6.8.3 bash -c 'bash check-installed.sh && bash check-display-sessions.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-button-candidates-${{ matrix.runner }}
          path: artifacts/linux
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-evidence-${{ matrix.runner }}
          path: |
            artifacts/linux
            artifacts/package/install
            artifacts/package/environment.json
            artifacts/package/display-evidence
            artifacts/package/catalog-evidence
            build/linux/Testing/Temporary/LastTest.log
  button-mirror-comparison:
    needs: build-runtime-package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        source-runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tools/visual-requirements.txt
      - run: python3 scripts/verify-references.py
      - uses: actions/download-artifact@v4
        with:
          name: desktop-button-candidates-${{ matrix.source-runner }}
          path: artifacts/candidate
      - name: Strict preserved-source comparison
        run: python3 scripts/compare-captures.py --reference reference/captures/desktop/buttons --candidate artifacts/candidate --output artifacts/comparison
      - name: Record independent visual result
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path('artifacts/comparison/comparison.json')
          if report.exists():
              result = json.loads(report.read_text())
              passed = sum(case['status'] == 'passed' for case in result['results'])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"Button source comparison: **{result['status']}** ({passed}/{len(result['results'])} cases).\n\n")
                  summary.write('Zero pixel tolerance. Build, installed consumption, display sessions, accessibility and complete desktop acceptance have separate gates.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-button-comparison-${{ matrix.source-runner }}
          path: artifacts/comparison
          if-no-files-found: error
  proposal-mirror-diagnostics:
    needs: build-runtime-package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        source-runner: [ubuntu-24.04, ubuntu-24.04-arm]
        reference-group: [desktop, composition, selectors, checkbox, secure-field, search-field, collection-filters, slider, tabs, pagination, pagination-integers, accordion, presentation-states, alert, navigation, sidebar-brand, data-metrics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tools/visual-requirements.txt
      - run: python3 scripts/verify-proposals.py
      - uses: actions/download-artifact@v4
        with:
          name: desktop-button-candidates-${{ matrix.source-runner }}
          path: artifacts/candidate
      - name: Compare every implemented isolated API against proposed source captures
        run: |
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('comparison', 'scripts/compare-captures.py')
          comparison = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(comparison)
          group = '${{ matrix.reference-group }}'
          directories = {'desktop': ('proposals', 'desktop-20261012'),
                         'composition': ('composition-proposals', 'composition-20261012-v1'),
                         'selectors': ('selector-proposals', 'selectors-20261013'),
                         'checkbox': ('checkbox-proposals', 'checkbox-20261013'),
                         'secure-field': ('secure-field-proposals', 'secure-field-20261014'),
                         'search-field': ('search-field-proposals', 'search-field-20261014'),
                         'collection-filters': ('collection-filters-proposals', 'collection-filters-20261014'),
                         'slider': ('slider-proposals', 'slider-20261014-v2'),
                         'tabs': ('tabs-proposals', 'tabs-20261014'),
                         'pagination': ('pagination-proposals', 'pagination-20261014'),
                         'pagination-integers': ('pagination-integer-proposals', 'pagination-integers-20261014'),
                         'accordion': ('accordion-proposals', 'accordion-20261014'),
                         'presentation-states': ('presentation-state-proposals', 'presentation-states-20261015-v2'),
                         'alert': ('alert-proposals', 'alert-20261015'),
                         'navigation': ('navigation-proposals', 'navigation-layout-20261015'),
                         'sidebar-brand': ('sidebar-brand-proposals', 'sidebar-brand-20261015'),
                         'data-metrics': ('data-metrics-proposals', 'data-metrics-20261015')}
          capture_directory, reference_directory = directories[group]
          captures = Path('artifacts/candidate') / capture_directory
          reference = Path('evidence/reference-proposals') / reference_directory
          result = json.loads((captures / 'capture-results.json').read_text())
          assert result['status'] == 'captured'
          raise SystemExit(comparison.compare(reference, captures,
              Path('artifacts/proposal-comparison'), result['selectedApis']))
          PY
      - name: Report proposal diagnostics independently of baseline acceptance
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('artifacts/proposal-comparison/comparison.json')
          if path.is_file():
              result = json.loads(path.read_text())
              cases = result['results']
              passed = sum(c['status'] == 'passed' for c in cases)
              geometry = sum(c.get('geometryStatus') == 'passed' for c in cases)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"Proposed-reference diagnostics: **{result['status']}**; {passed}/{len(cases)} exact image and geometry matches; {geometry}/{len(cases)} geometry matches.\n\n")
                  summary.write('References are proposed. These results approve no baseline, exception, component, animation phase, session, accessibility or installed-package gate.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.reference-group }}-proposal-comparison-${{ matrix.source-runner }}
          path: artifacts/proposal-comparison
          if-no-files-found: error
